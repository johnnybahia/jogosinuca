name: Deploy (Cloudflare, plano gratuito)
# Todo push na main testa, gera o build e publica jogo + servidor num Worker só.
# O jogo instalado/aberto percebe a versão nova sozinho e mostra o botão "Atualizar".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publicar (só se os segredos do Cloudflare existirem)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
      - name: Aviso
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Sem CLOUDFLARE_API_TOKEN nos segredos do repositório - build testado, mas nada foi publicado."
