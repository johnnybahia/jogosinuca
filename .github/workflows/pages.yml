# Publica o jogo no GitHub Pages (https://<usuario>.github.io/<repositório>/) a cada push na main.
# Serve para jogar offline contra o computador sem criar conta na Cloudflare. Para o online funcionar a partir daqui,
# defina a variável do repositório SERVER_URL com o endereço do Worker (ex.: https://sinuca3d.SUA-CONTA.workers.dev).
# Uma vez só: Settings → Pages → Build and deployment → Source: "GitHub Actions" e criar a variável do repositório ENABLE_PAGES = true.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
